name: Build ProfilePilot Android APK

on:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Reconstruct and verify Android source archive
        run: |
          python3 - <<'PY'
          import base64, hashlib, pathlib
          paths = [pathlib.Path(f'source.part{i:02d}') for i in range(1, 7)]
          encoded = ''.join(path.read_text(encoding='utf-8').strip() for path in paths)
          print('Encoded bytes:', len(encoded))
          print('Encoded SHA256:', hashlib.sha256(encoded.encode()).hexdigest())
          raw = base64.b64decode(encoded, validate=True)
          print('Archive bytes:', len(raw))
          print('Archive SHA256:', hashlib.sha256(raw).hexdigest())
          pathlib.Path('profilepilot-android-source.zip').write_bytes(raw)
          PY
          unzip -t profilepilot-android-source.zip
          unzip -q profilepilot-android-source.zip -d app-source

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3

      - name: Install Android SDK 35
        run: |
          yes | sdkmanager --licenses >/dev/null
          sdkmanager 'platforms;android-35' 'build-tools;35.0.0'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Run unit tests and build APK
        working-directory: app-source
        run: gradle --no-daemon testDebugUnitTest assembleDebug

      - name: Verify signed APK
        working-directory: app-source
        run: |
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose app/build/outputs/apk/debug/app-debug.apk
          cp app/build/outputs/apk/debug/app-debug.apk ../ProfilePilot-Android-Autofill.apk

      - uses: actions/upload-artifact@v4
        with:
          name: ProfilePilot-Android-Autofill
          path: |
            ProfilePilot-Android-Autofill.apk
            profilepilot-android-source.zip
          if-no-files-found: error
