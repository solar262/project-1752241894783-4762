name: Build ProfilePilot Android APK

on:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3

      - name: Install Android SDK 35
        run: |
          yes | sdkmanager --licenses >/dev/null
          sdkmanager 'platforms;android-35' 'build-tools;35.0.0'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Run unit tests and build APK
        id: android_build
        continue-on-error: true
        run: |
          set -o pipefail
          gradle --no-daemon testDebugUnitTest assembleDebug 2>&1 | tee build.log

      - name: Upload build diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ProfilePilot-build-diagnostics
          path: build.log
          if-no-files-found: warn

      - name: Stop after failed build
        if: steps.android_build.outcome == 'failure'
        run: exit 1

      - name: Verify signed APK
        run: |
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose app/build/outputs/apk/debug/app-debug.apk
          cp app/build/outputs/apk/debug/app-debug.apk ProfilePilot-Android-Autofill.apk
          zip -qr profilepilot-android-source.zip README.md settings.gradle build.gradle gradle.properties app .github/workflows/android.yml -x '*/build/*'

      - uses: actions/upload-artifact@v4
        with:
          name: ProfilePilot-Android-Autofill
          path: |
            ProfilePilot-Android-Autofill.apk
            profilepilot-android-source.zip
          if-no-files-found: error
