name: Build ProfilePilot Android APK

on:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Reconstruct Android source archive
        run: |
          cat source.part01 source.part02 source.part03 source.part04 source.part05 source.part06 | base64 --decode > profilepilot-android-source.zip
          unzip -t profilepilot-android-source.zip
          unzip -q profilepilot-android-source.zip -d app-source

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3

      - name: Install Android SDK 35
        run: |
          yes | sdkmanager --licenses >/dev/null
          sdkmanager 'platforms;android-35' 'build-tools;35.0.0'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Run unit tests and build APK
        working-directory: app-source
        run: gradle --no-daemon testDebugUnitTest assembleDebug

      - name: Verify signed APK
        working-directory: app-source
        run: |
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose app/build/outputs/apk/debug/app-debug.apk
          cp app/build/outputs/apk/debug/app-debug.apk ../ProfilePilot-Android-Autofill.apk

      - uses: actions/upload-artifact@v4
        with:
          name: ProfilePilot-Android-Autofill
          path: |
            ProfilePilot-Android-Autofill.apk
            profilepilot-android-source.zip
          if-no-files-found: error
